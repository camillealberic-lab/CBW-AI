<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>CBW AI bulles</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:500 13px -apple-system,sans-serif}
body{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:8px;padding:0 4px 4px;box-sizing:border-box}
.c{background:rgba(20,20,22,.9);color:#fff;border-radius:12px;padding:10px 12px;position:relative;animation:in .24s ease-out}
.c.ok{background:rgba(21,128,61,.92);transition:opacity .8s;opacity:0}
.q{margin-right:18px;line-height:1.35}.s{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button{font:inherit;border:0;border-radius:8px;padding:5px 9px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
button:hover{background:rgba(255,255,255,.26)}.x{position:absolute;top:6px;right:6px;padding:2px 6px;background:none}
#h{align-self:flex-end;background:rgba(20,20,22,.85);color:#fff;border-radius:10px;padding:4px 10px;font-size:12px}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
</style></head><body><div id="h" hidden></div>
<script>
var B=window.cbwBubbles,gone={},hov=false;
function fmt(ms){var s=Math.floor((ms||0)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(st){
  var open=(st.live||[]).filter(function(q){return q.state==='open'&&!gone[q.id]}).slice(-3);
  var h=document.getElementById('h');h.hidden=!st.recording;h.textContent='Brainstorm · '+fmt(st.elapsedMs)+' · '+open.length+' question'+(open.length>1?'s':'');
  var have={};Array.prototype.forEach.call(document.querySelectorAll('.c'),function(c){if(!open.some(function(q){return q.id===c.dataset.id})&&!c.classList.contains('ok')){c.classList.add('ok');setTimeout(function(){c.remove()},800)}else have[c.dataset.id]=1});
  open.forEach(function(q){if(have[q.id])return;var c=document.createElement('div');c.className='c';c.dataset.id=q.id;
    var t=document.createElement('div');t.className='q';t.textContent=q.question;c.appendChild(t);
    var x=document.createElement('button');x.className='x';x.textContent='×';x.onclick=function(){gone[q.id]=1;B&&B.dismiss(q.id);c.remove()};c.appendChild(x);
    var s=document.createElement('div');s.className='s';(q.suggestions||[]).forEach(function(v){var b=document.createElement('button');b.textContent=v;b.onclick=function(){gone[q.id]=1;B&&B.answer(q.id,v);c.classList.add('ok');setTimeout(function(){c.remove()},800)};s.appendChild(b)});
    c.appendChild(s);document.body.insertBefore(c,h)});
}
document.addEventListener('mousemove',function(e){var on=!!(e.target.closest&&e.target.closest('.c,#h'));if(on!==hov){hov=on;B&&B.setHover&&B.setHover(on)}});
document.addEventListener('mouseleave',function(){if(hov){hov=false;B&&B.setHover&&B.setHover(false)}});
if(B)B.onState(render);
</script></body></html>
