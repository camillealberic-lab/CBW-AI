<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' file:; font-src 'self' file: data:; script-src 'self' 'unsafe-inline'; img-src data:">
<title>CBW AI — Brainstorm (démo)</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../cbw/tokens.css">
<style>
  :root{--encre:#1C1C1E;--fond-3:#ECECE8}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--encre:#F4F4F2;--fond-3:#2C2D31}}
  :root[data-theme="dark"]{--encre:#F4F4F2;--fond-3:#2C2D31}
  html,body{margin:0;height:100%;background:var(--fond)}
  #demo-badge{position:fixed;bottom:10px;left:12px;z-index:40;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;background:var(--fond-2);color:var(--texte-sec)}
</style>
</head>
<body>
<div id="demo-badge">Mode démo</div>
<main id="app"></main>
<script src="brainstorm-fake.js"></script>
<script src="brainstorm.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  if (qs.get('theme')) document.documentElement.dataset.theme = qs.get('theme');
  var view = qs.get('view') || '';
  var api = window.CBWBrainstormFake.create({ empty: view === 'empty', startMs: view === 'record' ? 214e3 : 0 });
  window.__bsDemo = api;
  var id = (/^#brainstorm:(.+)$/.exec(location.hash) || [])[1] || (view === 'result' || view === 'analyze' ? 'b3' : view === 'questions' || view === 'end' ? 'b2' : null);
  var inst = window.CBWBrainstorm.mount(document.getElementById('app'), {
    api: api, id: id,
    navigate: function (h) { history.replaceState(null, '', location.pathname + location.search + h); }
  });
  function click(sel, ms) { return new Promise(function (r) { setTimeout(function () { var b = document.querySelector(sel); if (b) b.click(); r(); }, ms || 0); }); }
  // Raccourcis de revue : ?view=record|compile|result|analyze|questions|end|empty
  //   record  : vidage en direct (fil de conversation + grille, reprise à 03:34)
  //   compile : « Terminer » → compilation directe   ·   analyze : résultat → « Encore une question »
  //   questions / end : ancien flux de questions (session b2)
  if (view === 'record' || view === 'record0') inst.start();
  else if (view === 'compile') { inst.start(); click('[data-act="stop"]', 900); }
  else if (view === 'analyze') click('[data-act="more"]', 600);
  else if (view === 'end') {
    var a = setInterval(function () {
      var v = document.querySelector('[data-act="valid"]');
      if (!v) { if (document.querySelector('.bs-end')) clearInterval(a); return; }
      var s = document.querySelector('.bs-sg[data-i="0"]'); if (s && s.getAttribute('aria-pressed') !== 'true') s.click();
      (s ? v : document.querySelector('[data-act="skip"]')).click();
    }, 150);
  }
})();
</script>
</body>
</html>
