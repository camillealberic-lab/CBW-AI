<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' file:; font-src 'self' file: data:; script-src 'self' 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>CBW AI</title>
<!--
  CBW AI — popover de la barre de menus (clic sur l'icône). Fenêtre 320 px, hauteur auto (pont : window.cbwTray,
  src/main/preload-tray.ts). Sans pont → démo : ?demo=idle|rec|ia|note|error  ?theme=light|dark
-->
<script>
(function () {
  var q = null; try { q = new URLSearchParams(location.search); } catch (e) { /* */ }
  var t = q && q.get('theme');
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  else if (!t && !window.cbwTray) document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
})();
</script>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
:root {
  --noir: #1E1E1C; --encre: #1C1C1E;
  --orange: #FF5A1F; --bleu: #2B3BFF; --vert: #1FD26A; --erreur: #B3261E;
  --fond: #FFFFFF; --fond-2: #F4F4F2; --texte: #1E1E1C; --texte-sec: #5F5F5A; --texte-3: #6E6E6A;
  --trait: #1C1C1E; --fil: #DDDDDD; --inverse-fond: #1C1C1E; --inverse-texte: #FFFFFF; --focus: #2B3BFF;
  --police: 'Archivo', "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --mono: 'CBWSym', 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #1A1B1D; --fond-2: #202124; --texte: #ECECEA; --texte-sec: #A3A3A0; --texte-3: #8C8C88;
    --trait: #D9D9D6; --fil: #3A3B3E; --inverse-fond: #ECECEA; --inverse-texte: #1C1C1E; --erreur: #FF6B5E; --focus: #7C86FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #1A1B1D; --fond-2: #202124; --texte: #ECECEA; --texte-sec: #A3A3A0; --texte-3: #8C8C88;
  --trait: #D9D9D6; --fil: #3A3B3E; --inverse-fond: #ECECEA; --inverse-texte: #1C1C1E; --erreur: #FF6B5E; --focus: #7C86FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); }
body {
  width: 320px; border: 2px solid var(--trait); color: var(--texte);
  font: 13px/1.45 var(--police); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; cursor: default; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: default; text-align: left; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
[hidden] { display: none !important; }
.label { font: 500 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--texte-sec); }

/* En-tête : marque C·B·W + état */
.head { padding: 14px 16px 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.sq { display: flex; gap: 3px; }
.sq i { width: 10px; height: 10px; display: block; transition: opacity .2s var(--ease); }
.sq .o { background: var(--orange); } .sq .b { background: var(--bleu); } .sq .v { background: var(--vert); }
body[data-tone="ready"] .sq i:not(.v), body[data-tone="rec"] .sq i:not(.o), body[data-tone="ia"] .sq i:not(.b) { opacity: .18; }
body[data-tone="error"] .sq i { opacity: .18; }
body[data-tone="rec"] .sq .o, body[data-tone="ia"] .sq .b { animation: pulse 1.1s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.brand .label { flex: 1; }
.status { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
.status .dot { width: 12px; height: 12px; flex: none; background: var(--vert); }
body[data-tone="rec"] .status .dot { background: var(--orange); animation: pulse 1.1s var(--ease) infinite; }
body[data-tone="ia"] .status .dot { background: var(--bleu); animation: pulse .8s var(--ease) infinite; }
body[data-tone="error"] .status .dot { background: var(--erreur); }
.status h1 { margin: 0; font: 800 22px/1.1 var(--police); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.detail { margin-top: 6px; }
body[data-tone="error"] .detail { color: var(--erreur); text-transform: none; letter-spacing: 0; font-size: 11.5px; }
.rule { height: 2px; background: var(--trait); }

/* Tuiles d'action */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 16px; }
.tile {
  position: relative; height: 112px; border: 2px solid var(--trait); background: var(--fond);
  display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
  transition: transform .12s var(--ease), box-shadow .12s var(--ease), background-color .2s var(--ease);
}
.tile:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--trait); }
.tile:active:not(:disabled) { transform: none; box-shadow: none; }
.tile:disabled { opacity: .38; }
.tile .glyph { display: flex; align-items: center; gap: 3px; height: 26px; }
.tile .glyph i { display: block; width: 5px; background: currentColor; }
.tile .glyph.lines { flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; }
.tile .glyph.lines i { height: 3px; width: 26px; }
.tile .glyph.lines i:nth-child(2) { width: 20px; } .tile .glyph.lines i:nth-child(3) { width: 14px; }
.tile .t { font: 800 19px/1 var(--police); letter-spacing: -.03em; }
.tile .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
.kbd { font: 600 11px/1 var(--mono); padding: 4px 5px; border: 1.5px solid currentColor; letter-spacing: .04em; white-space: nowrap; }
.tile.on { background: var(--orange); border-color: var(--orange); color: #1C1C1E; }
.tile.on:hover { box-shadow: 4px 4px 0 var(--trait); }
.tile.on .kbd { border-color: #1C1C1E; }
.tile.on .glyph:not(.lines) i { animation: bar .9s var(--ease) infinite alternate; }
.tile.on .glyph i:nth-child(2) { animation-delay: .15s; } .tile.on .glyph i:nth-child(3) { animation-delay: .3s; }
.tile.on .glyph i:nth-child(4) { animation-delay: .45s; } .tile.on .glyph i:nth-child(5) { animation-delay: .6s; }
@keyframes bar { to { transform: scaleY(.35); } }
.pause { margin: -8px 16px 16px; width: calc(100% - 32px); border: 2px solid var(--trait); padding: 7px 10px; text-align: center; }
.pause:hover { background: var(--inverse-fond); color: var(--inverse-texte); }

/* Aujourd'hui + dernière dictée */
.today { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--fil); }
.today .v { font: 500 12px/1.3 var(--mono); color: var(--texte-sec); white-space: nowrap; }
.today .v b { font-weight: 700; color: var(--texte); }
.last { display: block; width: 100%; padding: 10px 16px 12px; border-top: 1px solid var(--fil); }
.last:hover { background: var(--fond-2); }
.last .top { display: flex; justify-content: space-between; gap: 8px; }
.last .copy { color: var(--texte); }
.last.ok .copy { color: var(--vert); }
.last .txt { margin-top: 5px; font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.last.empty .txt { color: var(--texte-3); }

/* Alertes */
.alert { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--fil); font-size: 12.5px; }
.alert::before { content: ''; width: 8px; height: 8px; background: var(--orange); flex: none; }
.alert span { flex: 1; }
.alert b { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
button.alert:hover { background: var(--fond-2); }

/* Pied */
.foot { display: grid; grid-template-columns: 1.4fr 1fr 1fr; }
.foot button { padding: 11px 8px; text-align: center; font: 600 10.5px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.foot button + button { border-left: 1px solid var(--fil); }
.foot button:hover { background: var(--inverse-fond); color: var(--inverse-texte); }
.meta { display: flex; align-items: center; justify-content: space-between; padding: 7px 16px 8px; border-top: 1px solid var(--fil); min-height: 32px; }
.meta .label { color: var(--texte-3); }
.chip { font: 700 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 5px 7px; background: var(--vert); color: #1C1C1E; }
.chip:hover { background: var(--inverse-fond); color: var(--inverse-texte); }
/* JetBrains Mono dessine ⌃ comme ^ : symboles de touches pris dans la police système */
@font-face { font-family: 'CBWSym'; src: local('Apple Symbols'), local('AppleSymbols'), local('Lucida Grande'), local('LucidaGrande'), local('Menlo-Regular'); unicode-range: U+2303, U+2318, U+2325, U+21E7, U+238B; }
</style>
</head>
<body data-tone="ready">
  <header class="head">
    <div class="brand">
      <div class="sq" aria-hidden="true"><i class="o"></i><i class="b"></i><i class="v"></i></div>
      <span class="label">CBW AI</span>
    </div>
    <div class="status"><span class="dot" aria-hidden="true"></span><h1 id="label" aria-live="polite">Prêt à dicter</h1></div>
    <div class="detail label" id="detail"></div>
  </header>
  <div class="rule"></div>

  <div class="tiles">
    <button class="tile" id="t-dictate" type="button">
      <span class="glyph" aria-hidden="true"><i style="height:10px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:18px"></i><i style="height:10px"></i></span>
      <span class="row"><span class="t" id="t-dictate-l">Dicter</span><span class="kbd" id="k-dictate">⌃⌃</span></span>
    </button>
    <button class="tile" id="t-note" type="button">
      <span class="glyph lines" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="row"><span class="t" id="t-note-l">Note</span><span class="kbd" id="k-note">⌃⌃⌃</span></span>
    </button>
  </div>
  <button class="pause label" id="pause" type="button" hidden>Mettre en pause</button>

  <div class="today" id="today">
    <span class="label">Aujourd'hui</span>
    <span class="v" id="today-v"></span>
  </div>
  <button class="last" id="last" type="button">
    <span class="top"><span class="label" id="last-when">Dernière dictée</span><span class="label copy" id="last-copy">Copier</span></span>
    <span class="txt" id="last-txt"></span>
  </button>
  <div id="alerts"></div>

  <div class="rule"></div>
  <nav class="foot">
    <button type="button" data-act="openApp">Ouvrir CBW AI</button>
    <button type="button" data-act="settings">Réglages</button>
    <button type="button" data-act="quit">Quitter</button>
  </nav>
  <div class="meta">
    <span class="label" id="version"></span>
    <button class="chip" id="update" type="button" hidden>Mise à jour prête</button>
  </div>

<script>
(function () {
  'use strict';
  var bridge = window.cbwTray || null;
  var $ = function (id) { return document.getElementById(id); };
  var state = null;
  var nf = function (n) { try { return Number(n).toLocaleString('fr-FR'); } catch (e) { return String(n); } };
  var mmss = function (ms) { var s = Math.floor((ms || 0) / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  function ago(iso) {
    var t = Date.parse(iso); if (!isFinite(t)) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "à l'instant";
    if (m < 60) return 'il y a ' + m + ' min';
    var h = Math.round(m / 60);
    if (h < 24) return 'il y a ' + h + ' h';
    var d = Math.round(h / 24);
    return d === 1 ? 'hier' : 'il y a ' + d + ' j';
  }

  function render(s) {
    if (!s) return;
    state = s;
    var root = document.documentElement;
    if (!root.hasAttribute('data-forced')) {
      if (s.theme === 'dark' || s.theme === 'light') root.setAttribute('data-theme', s.theme);
      else root.removeAttribute('data-theme');
    }
    document.body.dataset.tone = s.tone;
    $('label').textContent = s.label;
    var det = s.detail;
    if (!det) {
      if (s.note.active) det = s.note.paused ? 'Pause · reprise quand tu veux' : 'Enregistrement de la réunion';
      else if (s.dictating) det = 'Parle, puis ' + (s.shortcuts.dictate || 'Dicter') + ' pour coller';
      else if (s.tone === 'ia') det = 'Traitement par l’IA';
      else det = (s.shortcuts.dictate ? s.shortcuts.dictate + ' dicter' : '') + (s.shortcuts.note ? ' · ' + s.shortcuts.note + ' note' : '');
    }
    $('detail').textContent = det;
    $('detail').hidden = !det;

    var td = $('t-dictate');
    td.classList.toggle('on', !!s.dictating);
    td.disabled = !s.canDictate && !s.dictating;
    $('t-dictate-l').textContent = s.dictating ? 'Arrêter' : 'Dicter';
    $('k-dictate').textContent = s.dictating ? '● REC' : (s.shortcuts.dictate || '');
    $('k-dictate').hidden = !$('k-dictate').textContent;

    var tn = $('t-note');
    tn.classList.toggle('on', !!s.note.active);
    tn.disabled = !s.canNote;
    $('t-note-l').textContent = s.note.active ? 'Terminer' : 'Note';
    $('k-note').textContent = s.note.active ? mmss(s.note.elapsedMs) : (s.shortcuts.note || '');
    $('k-note').hidden = !$('k-note').textContent;
    $('pause').hidden = !s.note.active;
    $('pause').textContent = s.note.paused ? '▶ Reprendre la note' : 'Ⅱ Mettre en pause';

    var t = s.today || { words: 0, savedMin: 0 };
    $('today-v').innerHTML = '';
    var w = document.createElement('b'); w.textContent = nf(t.words);
    $('today-v').append(w, ' mots');
    if (t.savedMin > 0) { var g = document.createElement('b'); g.textContent = '~' + nf(t.savedMin) + ' min'; $('today-v').append(' · ', g, ' gagnées'); }

    var last = $('last');
    if (!last.classList.contains('ok')) $('last-copy').textContent = s.last ? 'Copier' : '';
    last.classList.toggle('empty', !s.last);
    last.disabled = !s.last;
    $('last-when').textContent = 'Dernière dictée' + (s.last && ago(s.last.at) ? ' · ' + ago(s.last.at) : '');
    $('last-txt').textContent = s.last ? s.last.text : 'Rien pour l’instant — ' + (s.shortcuts.dictate || 'Dicter') + ' pour commencer.';

    var al = $('alerts'); al.textContent = '';
    (s.alerts || []).forEach(function (a) {
      var el = document.createElement(a.action ? 'button' : 'div');
      el.className = 'alert';
      if (a.action) { el.type = 'button'; el.dataset.act = a.action; }
      var sp = document.createElement('span'); sp.textContent = a.label; el.append(sp);
      if (a.action) { var b = document.createElement('b'); b.textContent = 'Régler →'; el.append(b); }
      al.append(el);
    });

    $('version').textContent = s.version ? 'v' + s.version : '';
    $('update').hidden = !(s.update && s.update.ready);
    if (s.update && s.update.version) $('update').title = 'Installer la v' + s.update.version + ' et redémarrer';
    fit();
  }

  function fit() { if (bridge && bridge.resize) bridge.resize(Math.ceil(document.body.getBoundingClientRect().height)); }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) { /* */ }

  function act(name) {
    if (bridge) return bridge.action(name);
    console.log('[démo] action', name);
  }
  $('t-dictate').addEventListener('click', function () { act('dictate'); });
  $('t-note').addEventListener('click', function () { act('note'); });
  $('pause').addEventListener('click', function () { act('notePause'); });
  $('update').addEventListener('click', function () { act('install'); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (b) act(b.dataset.act);
  });
  var copyT = null;
  $('last').addEventListener('click', function () {
    if (!state || !state.last) return;
    var done = function (ok) {
      if (!ok) return;
      $('last').classList.add('ok'); $('last-copy').textContent = 'Copié ✓';
      clearTimeout(copyT);
      copyT = setTimeout(function () { $('last').classList.remove('ok'); $('last-copy').textContent = 'Copier'; }, 1400);
    };
    if (bridge) bridge.copyLast().then(done, function () { /* */ }); else done(true);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') act('hide');
    else if (e.metaKey && e.key === ',') act('settings');
    else if (e.metaKey && (e.key === 'q' || e.key === 'Q')) act('quit');
  });

  if (bridge) {
    bridge.onState(render);
    bridge.getState().then(render, function () { /* */ });
    // durée de note / « il y a … » : rafraîchies par le main, horloge locale en secours
    return;
  }

  /* ───────── Démo (sans pont) ───────── */
  var q = new URLSearchParams(location.search);
  if (q.get('theme')) document.documentElement.setAttribute('data-forced', '1');
  var demo = q.get('demo') || 'idle';
  var base = {
    tone: 'ready', label: 'Prêt à dicter', detail: '', dictating: false, canDictate: true,
    note: { active: false, paused: false, elapsedMs: 0, busy: false }, canNote: true,
    shortcuts: { dictate: '⌃⌃', note: '⌃⌃⌃' },
    today: { words: 1240, dictations: 18, savedMin: 23 },
    last: { text: 'Salut Marie, je te confirme le rendez-vous de jeudi à 14 h. Je t’envoie le brief complet ce soir avec les maquettes de la page d’accueil.', at: new Date(Date.now() - 4 * 60000).toISOString() },
    alerts: [], version: '1.0.11', update: { ready: false }, theme: 'system',
  };
  var demos = {
    idle: {},
    rec: { tone: 'rec', label: 'Écoute…', dictating: true, canNote: false },
    ia: { tone: 'ia', label: 'Nettoyage…', canDictate: true },
    note: { tone: 'rec', label: 'Note en cours 12:47', note: { active: true, paused: false, elapsedMs: 767000, busy: true }, canDictate: false, update: { ready: true, version: '1.0.12' } },
    error: { tone: 'error', label: 'Erreur', detail: 'Rien entendu — vérifie le micro', alerts: [{ id: 'ax', label: 'Accessibilité requise pour coller', action: 'grantAx' }, { id: 'llm', label: 'Nettoyage IA indisponible (texte brut)' }], last: null, today: { words: 0, dictations: 0, savedMin: 0 } },
  };
  var s = Object.assign({}, base, demos[demo] || {});
  render(s);
})();
</script>
</body>
</html>
