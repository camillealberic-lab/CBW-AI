<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' file:; font-src 'self' file: data:; script-src 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Mise à jour — CBW AI</title>
<!--
  CBW AI — fenêtre « Nouvelle version » (src/main/updatePopup.ts). Fenêtre sans cadre ~460 px, centrée sur l'écran.
  Pont : window.cbwUpdate (src/main/preload-update.ts) — onData(cb), install() → {ok, message?}, later(), resize(h).
  Sans pont → démo (données factices). Revue : ?theme=dark|light
  Clavier : Entrée = Mettre à jour · Échap = Plus tard. Volontairement épurée : pas de notes de version (bruit technique).
-->
<script>
(function () {
  try { var t = new URLSearchParams(location.search).get('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* */ }
})();
</script>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
:root {
  --noir: #1E1E1C; --encre: #1C1C1E; --blanc: #FFFFFF;
  --orange: #FF5A1F; --bleu: #2B3BFF; --vert: #1FD26A; --erreur: #B3261E;
  --fond: #FFFFFF; --fond-2: #F4F4F2; --texte: var(--noir); --texte-sec: #5F5F5A; --texte-3: #6E6E6A;
  --trait: var(--noir); --fil: #DDDDDD; --fil-fort: #C4C4BF;
  --inverse-fond: var(--encre); --inverse-texte: var(--blanc); --focus: var(--bleu);
  --police: 'Archivo', "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.2,1); --ease-sortie: cubic-bezier(.16,1,.3,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #1A1B1D; --fond-2: #25262A; --texte: #ECECEA; --texte-sec: #A3A3A0; --texte-3: #8C8C88;
    --trait: #D9D9D6; --fil: #3A3B3E; --fil-fort: #55565B;
    --inverse-fond: #ECECEA; --inverse-texte: #1C1C1E; --focus: #7C86FF; --erreur: #FF6B5E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #1A1B1D; --fond-2: #25262A; --texte: #ECECEA; --texte-sec: #A3A3A0; --texte-3: #8C8C88;
  --trait: #D9D9D6; --fil: #3A3B3E; --fil-fort: #55565B;
  --inverse-fond: #ECECEA; --inverse-texte: #1C1C1E; --focus: #7C86FF; --erreur: #FF6B5E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--texte); }
body {
  font: 14px/1.5 var(--police); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; cursor: default; overflow: hidden;
}
/* La fenêtre elle-même est le cadre : filet de 2 px, coins carrés. */
.card {
  position: relative; border: 2px solid var(--trait); background: var(--fond);
  padding: 40px 40px 24px; display: flex; flex-direction: column;
  -webkit-app-region: drag;
  animation: enter 200ms var(--ease-sortie) both;
}
.card button { -webkit-app-region: no-drag; }
@keyframes enter { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card, .bar i { animation: none !important; } .btn, .link { transition: none !important; } }

/* en-tête : carrés C·B·W + kicker mono */
.head { display: flex; align-items: center; gap: 14px; }
.mark { display: inline-flex; gap: 3px; }
.mark i { width: 18px; height: 18px; display: block; }
.mark i:nth-child(1) { background: var(--orange); }
.mark i:nth-child(2) { background: var(--bleu); }
.mark i:nth-child(3) { background: var(--vert); }
.kicker { font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--texte-3); }

h1 { margin: 36px 0 0; font: 900 40px/1.02 var(--police); font-stretch: 85%; letter-spacing: -.03em; }
h1 .o { color: var(--orange); }
.sub { margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: var(--texte-sec); max-width: 30em; }

.msg { margin-top: 16px; font-size: 12.5px; line-height: 1.4; color: var(--erreur); }
.msg:empty { display: none; }

.actions { margin-top: 32px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.btn {
  position: relative; display: flex; align-items: center; justify-content: center;
  height: 48px; padding: 0 18px; border-radius: 0; border: 0;
  background: var(--inverse-fond); color: var(--inverse-texte); font: 800 14.5px/1 var(--police); letter-spacing: -.005em; cursor: default;
  transition: box-shadow 120ms var(--ease), transform 120ms var(--ease), opacity 120ms;
}
.btn:hover { box-shadow: 4px 4px 0 var(--orange); transform: translate(-2px, -2px); }
.btn:active { box-shadow: none; transform: none; }
.btn:focus-visible, .link:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.link {
  align-self: center; border: 0; background: none; padding: 4px 6px; cursor: default;
  font: 500 13px/1 var(--police); color: var(--texte-3); transition: color 120ms var(--ease);
}
.link:hover { color: var(--texte); }
button:disabled { pointer-events: none; }
.busy .link { opacity: .35; }

/* barre de progression indéterminée (état « Redémarrage… ») */
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; display: none; }
.busy .bar { display: block; }
.bar i { position: absolute; top: 0; bottom: 0; width: 40%; background: var(--orange); animation: run 1.1s cubic-bezier(.7,0,.2,1) infinite; }
@keyframes run { from { left: -40%; } to { left: 100%; } }
</style>
</head>
<body>
<main class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="sub">
  <div class="head">
    <span class="mark" aria-label="CBW AI"><i></i><i></i><i></i></span>
    <span class="kicker">Mise à jour</span>
  </div>
  <h1 id="title">Nouvelle version prête<span class="o">.</span></h1>
  <p class="sub" id="sub">CBW AI <span id="tv">1.0.11</span> · redémarrage en 2 secondes, tes réglages sont conservés.</p>
  <div class="msg" id="msg" role="alert"></div>
  <div class="actions">
    <button class="btn" id="go" type="button">Mettre à jour</button>
    <button class="link" id="later" type="button">Plus tard</button>
  </div>
  <div class="bar" aria-hidden="true"><i></i></div>
</main>
<script>
(function () {
  var api = window.cbwUpdate || null;
  var $ = function (id) { return document.getElementById(id); };
  var busy = false;

  function render(d) {
    d = d || {};
    $('tv').textContent = String(d.version || '').replace(/^v/, '');
    setBusy(false);
    $('msg').textContent = d.message || '';
    fit();
    setTimeout(function () { $('go').focus(); }, 0);
  }

  function setBusy(on) {
    busy = on;
    document.body.classList.toggle('busy', on);
    $('go').disabled = on; $('later').disabled = on;
    $('go').textContent = on ? 'Redémarrage…' : 'Mettre à jour';
  }

  function fit() {
    if (api && api.resize) requestAnimationFrame(function () { api.resize(Math.ceil($('card').getBoundingClientRect().height)); });
  }

  function install() {
    if (busy) return;
    $('msg').textContent = '';
    setBusy(true);
    if (!api) { setTimeout(function () { setBusy(false); $('msg').textContent = 'Démo : aucune mise à jour réelle.'; }, 1400); return; }
    Promise.resolve(api.install()).then(function (r) {
      if (r && r.ok) return; // l'app se ferme puis se relance
      setBusy(false);
      $('msg').textContent = (r && r.message) || 'La mise à jour n’a pas pu démarrer.';
      fit();
    }, function (e) { setBusy(false); $('msg').textContent = String(e && e.message || e); fit(); });
  }
  function later() { if (busy) return; if (api) api.later(); }

  $('go').addEventListener('click', install);
  $('later').addEventListener('click', later);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); later(); }
    else if (e.key === 'Enter' && document.activeElement !== $('later')) { e.preventDefault(); install(); }
  });

  if (api) api.onData(render);
  else render({ current: '1.0.10', version: '1.0.11' });
})();
</script>
</body>
</html>
