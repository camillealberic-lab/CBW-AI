<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>CBW AI — Bulles de brainstorm</title>
<!--
  CBW AI — bulles de questions du brainstorm en direct (docs/APP_API.md › Brainstorm v2).
  Fenêtre Electron recommandée : ~380 × 640, transparente, sans cadre, panneau non activable
  (focusable:false), alwaysOnTop 'floating', visibleOnAllWorkspaces, ancrée en bas à droite de
  l'écran actif au-dessus du Dock. Seules les cartes et l'en-tête sont des zones cliquables
  (le reste de la fenêtre est vide/transparent ; le main peut utiliser setIgnoreMouseEvents(true,{forward:true})
  et le basculer au survol d'une carte — hook optionnel window.cbwBubbles.setHover(bool)).

  Pont (preload) : window.cbwBubbles = { onState(cb), answer(qid, text), dismiss(qid), setHover?(on) }
    état = { live: [{ id, slot, question, suggestions, state: 'open'|'answered'|'dismissed', answer?, askedAt }],
             title, recording, elapsedMs }
  Sans pont → mode démo (questions simulées). Paramètres démo :
    ?scene=1|2|3|answered   image figée (captures)     ?bg=light|dark   faux fond d'écran
    ?theme=light|dark       force le thème
-->
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  :root {
    --orange: #FF5A1F;
    --bleu: #2B3BFF;
    --vert: #1FD26A;
    --vert-pt: #15803D;
    --surface: #FFFFFF;
    --surface-2: #F4F4F2;
    --texte: #1E1E1C;
    --texte-sec: #5F5F5A;
    --texte-3: #6E6E6A;
    --bord: rgba(30, 30, 28, 0.16);
    --fil: #E4E4E0;
    --fil-fort: #C4C4BF;
    --tuile: var(--bleu);
    --sur-tuile: #FFFFFF;
    --ombre: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 20px rgba(0, 0, 0, 0.13);
    --ombre-h: 0 1px 2px rgba(0, 0, 0, 0.07), 0 10px 26px rgba(0, 0, 0, 0.17);
    --rayon: 3px;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --police: 'Archivo', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #25262A;
      --surface-2: #2C2D31;
      --texte: #ECECEA;
      --texte-sec: #A3A3A0;
      --texte-3: #8C8C88;
      --bord: rgba(255, 255, 255, 0.14);
      --fil: #3A3B3E;
      --fil-fort: #55565B;
      --tuile: #5A67FF;
      --vert-pt: var(--vert);
      --ombre: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.38);
      --ombre-h: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 12px 30px rgba(0, 0, 0, 0.46);
    }
  }
  :root[data-theme="dark"] {
    --surface: #25262A;
    --surface-2: #2C2D31;
    --texte: #ECECEA;
    --texte-sec: #A3A3A0;
    --texte-3: #8C8C88;
    --bord: rgba(255, 255, 255, 0.14);
    --fil: #3A3B3E;
    --fil-fort: #55565B;
    --tuile: #5A67FF;
    --vert-pt: var(--vert);
    --ombre: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.38);
    --ombre-h: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 12px 30px rgba(0, 0, 0, 0.46);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: stretch;
    padding: 16px;
    font: 400 14px/1.4 var(--police);
    color: var(--texte);
    -webkit-font-smoothing: antialiased;
  }
  /* faux fonds d'écran (démo / captures uniquement) */
  html[data-bg="light"] body { background: radial-gradient(120% 80% at 10% 0%, #F6D9C4 0%, transparent 60%), radial-gradient(90% 70% at 100% 100%, #BFD3EE 0%, transparent 65%), linear-gradient(160deg, #EDE7DF, #D7DEE6); }
  html[data-bg="dark"] body { background: radial-gradient(100% 70% at 0% 0%, #2B3350 0%, transparent 60%), radial-gradient(90% 70% at 100% 100%, #3B2433 0%, transparent 65%), linear-gradient(160deg, #15171C, #0E0F12); }

  /* ---------- en-tête « BRAINSTORM · mm:ss · N questions » ---------- */
  #head {
    align-self: flex-end;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 26px;
    padding: 0 10px 0 9px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    box-shadow: var(--ombre);
    font: 500 10.5px/1 var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--texte-sec);
    white-space: nowrap;
    transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out);
  }
  #head[hidden] { display: flex; opacity: 0; transform: translateY(4px); pointer-events: none; }
  #head .sq { width: 8px; height: 8px; background: var(--tuile); flex: none; animation: breathe 2000ms ease-in-out infinite; }
  #head b { font-weight: 700; color: var(--texte); }
  #head .clk { font-variant-numeric: tabular-nums; color: var(--texte); }
  #head .sep { opacity: 0.5; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---------- pile ---------- */
  #stack { display: flex; flex-direction: column; }
  .slot-wrap {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 320ms var(--ease-out), opacity 240ms var(--ease-out);
  }
  /* clip seulement pendant l'animation (sinon l'ombre est coupée) ; marge latérale = place pour l'ombre */
  .slot-wrap > .clip { min-height: 0; padding: 0 16px; margin: 0 -16px; }
  .slot-wrap.anim > .clip { overflow: hidden; }
  .slot-wrap > .clip > .card { margin-bottom: 8px; }
  .slot-wrap:last-child > .clip > .card { margin-bottom: 4px; }
  .slot-wrap.enter { grid-template-rows: 0fr; }
  .slot-wrap.leave { grid-template-rows: 0fr; opacity: 0; }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    box-shadow: var(--ombre);
    padding: 11px 12px 12px 13px;
    transition: transform 240ms var(--ease-out), opacity 240ms var(--ease-out), border-color 160ms var(--ease), box-shadow 180ms var(--ease);
  }
  .slot-wrap.enter .card { transform: translateX(28px); opacity: 0; }
  .slot-wrap.leave .card { opacity: 0; }
  .card:hover { border-color: color-mix(in srgb, var(--texte) 34%, transparent); box-shadow: var(--ombre-h); transform: translateY(-1px); }
  .card.done:hover { transform: none; }

  .top { display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .tile {
    width: 18px; height: 18px; flex: none;
    display: grid; place-items: center;
    background: var(--tuile); color: var(--sur-tuile);
    font: 700 10.5px/1 var(--mono);
    transition: background-color 200ms var(--ease), color 200ms var(--ease);
  }
  .slotname {
    font: 500 10.5px/1 var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--texte-sec);
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 200ms var(--ease);
  }
  .x {
    appearance: none; border: 0; background: none; padding: 0;
    width: 22px; height: 22px; margin: -2px -4px -2px 0;
    display: grid; place-items: center;
    color: var(--texte-3);
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .x:hover { background: var(--surface-2); color: var(--texte); }
  .x:focus-visible, .chip:focus-visible { outline: 2px solid var(--tuile); outline-offset: 1px; }
  .x svg { width: 12px; height: 12px; display: block; }

  .q {
    margin: 8px 0 0;
    font: 650 15.5px/1.32 var(--police);
    letter-spacing: -0.008em;
    color: var(--texte);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: pretty;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    appearance: none; border: 0;
    min-height: 28px; max-width: 100%;
    padding: 0 10px;
    border-radius: 2px;
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--fil-fort);
    color: var(--texte);
    font: 700 12.5px/1.2 var(--police);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
    transition: background-color 150ms var(--ease), box-shadow 150ms var(--ease), transform 120ms var(--ease);
  }
  .chip:hover { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--texte); transform: translateY(-1px); }
  .chip:active { transform: scale(.97); }

  .hint {
    display: none;
    align-items: center; gap: 7px;
    margin-top: 10px; padding-top: 9px;
    border-top: 1px solid var(--fil);
    font: 500 10px/1 var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--texte-3);
  }
  .hint i { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); flex: none; animation: breathe 1600ms ease-in-out infinite; }
  .card.newest:not(.done) .hint { display: flex; }

  /* répondu */
  .ans {
    display: none;
    align-items: baseline; gap: 7px;
    margin-top: 7px;
    font: 500 13.5px/1.35 var(--police);
    color: var(--texte-sec);
    min-width: 0;
  }
  .ans span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ans em { font-style: normal; font: 500 10px/1 var(--mono); letter-spacing: 0.08em; color: var(--vert-pt); flex: none; }
  .ck { width: 14px; height: 14px; display: none; flex: none; }
  .ck path { stroke-dasharray: 22; stroke-dashoffset: 22; }
  .card.done { border-color: var(--vert); box-shadow: var(--ombre), inset 0 0 0 1px var(--vert); }
  .card.done .tile { background: var(--vert); color: #1E1E1C; }
  .card.done .slotname { color: var(--vert-pt); }
  .card.done .ck { display: block; color: var(--vert-pt); }
  .card.done .ck path { animation: draw 300ms var(--ease) 60ms forwards; }
  .card.done .chips, .card.done .x { display: none; }
  .card.done .q { -webkit-line-clamp: 1; color: var(--texte-sec); font-size: 14px; }
  .card.done .ans { display: flex; color: var(--texte); }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- mouvement réduit ---------- */
  @media (prefers-reduced-motion: reduce) {
    .slot-wrap, .card, #head { transition-duration: 1ms !important; }
    .slot-wrap.enter .card { transform: none; }
    .slot-wrap.leave { transition: opacity 160ms linear !important; }
    .card:hover, .chip:hover { transform: none; }
    #head .sq, .hint i { animation: none; }
    .card.done .ck path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <div id="head" hidden role="status" aria-live="off"><span class="sq" aria-hidden="true"></span><b>Brainstorm</b><span class="sep">·</span><span class="clk">00:00</span><span class="sep">·</span><span class="cnt">0 question</span></div>
  <div id="stack" role="log" aria-live="polite" aria-label="Questions du brainstorm"></div>

<script>
(function () {
  'use strict';

  var SLOTS = {
    contexte: ['C', 'Contexte'], role: ['R', 'Rôle'], action: ['A', 'Action'], format: ['F', 'Format'],
    cible: ['T', 'Cible & ton'], contraintes: ['+', 'Contraintes'], criteres: ['+', 'Critères'], exemples: ['+', 'Exemples']
  };
  var MAX = 3, HOLD = 800;
  var root = document.documentElement;
  var head = document.getElementById('head');
  var stack = document.getElementById('stack');
  var clk = head.querySelector('.clk'), cnt = head.querySelector('.cnt');
  var reduceMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced() { return !!(reduceMq && reduceMq.matches); }

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) { var s = Math.max(0, Math.floor((ms || 0) / 1000)); return (s >= 3600 ? Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) : pad(Math.floor(s / 60))) + ':' + pad(s % 60); }

  var X_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>';
  var CK_SVG = '<svg class="ck" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';

  // ---------- pont ----------
  var bridge = window.cbwBubbles && typeof window.cbwBubbles.onState === 'function' ? window.cbwBubbles : null;
  var demo = null; // défini plus bas si pas de pont
  function send(m, a, b) {
    try {
      if (bridge && typeof bridge[m] === 'function') bridge[m](a, b);
      else if (demo && demo[m]) demo[m](a, b);
    } catch (e) { console.error(e); }
  }

  // ---------- cartes ----------
  var cards = {};   // id → { wrap, card, state, timer }
  var hoverOn = false;

  function cardHTML(q) {
    var s = SLOTS[q.slot] || ['?', q.slot || 'Question'];
    var sug = Array.isArray(q.suggestions) ? q.suggestions.slice(0, 3) : [];
    return '<div class="top"><span class="tile" aria-hidden="true">' + esc(s[0]) + '</span>' +
      '<span class="slotname" data-r="sn">' + esc(s[1]) + '</span>' + CK_SVG +
      '<button type="button" class="x" data-act="dismiss" tabindex="-1" aria-label="Ignorer la question" title="Ignorer">' + X_SVG + '</button></div>' +
      '<p class="q">' + esc(q.question) + '</p>' +
      (sug.length ? '<div class="chips">' + sug.map(function (t, i) {
        return '<button type="button" class="chip" data-act="answer" data-i="' + i + '" tabindex="-1" title="' + esc(t) + '">' + esc(t) + '</button>';
      }).join('') + '</div>' : '') +
      '<div class="ans"><em>→</em><span data-r="ans"></span></div>' +
      '<div class="hint"><i aria-hidden="true"></i>Réponds en parlant</div>';
  }

  function makeCard(q) {
    var wrap = document.createElement('div');
    wrap.className = 'slot-wrap' + (reduced() ? '' : ' enter anim');
    wrap.dataset.id = q.id;
    wrap.dataset.at = q.askedAt || Date.now();
    var clip = document.createElement('div'); clip.className = 'clip';
    var card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('aria-label', 'Question : ' + q.question);
    card.innerHTML = cardHTML(q);
    clip.appendChild(card); wrap.appendChild(clip);
    var c = { wrap: wrap, card: card, state: 'open', q: q, timer: 0 };
    // ordre : plus récente en bas
    var after = null;
    [].some.call(stack.children, function (w) { if (+w.dataset.at > +wrap.dataset.at) { after = w; return true; } return false; });
    stack.insertBefore(wrap, after);
    if (!reduced()) {
      void wrap.offsetHeight;
      requestAnimationFrame(function () { wrap.classList.remove('enter'); });
      setTimeout(function () { if (!wrap.classList.contains('leave')) wrap.classList.remove('anim'); }, 380);
    }
    cards[q.id] = c;
    return c;
  }

  function remove(id, how) {
    var c = cards[id]; if (!c || c.state === 'leaving') return;
    c.state = 'leaving'; clearTimeout(c.timer);
    c.wrap.classList.add('anim', 'leave');
    c.wrap.setAttribute('aria-hidden', 'true');
    setTimeout(function () { c.wrap.remove(); if (cards[id] === c) delete cards[id]; markNewest(); }, reduced() ? 170 : (how === 'collapse' ? 340 : 260));
    markNewest();
  }

  function markAnswered(id, answer) {
    var c = cards[id]; if (!c || c.state !== 'open') return;
    c.state = 'answered';
    c.card.querySelector('[data-r="ans"]').textContent = answer || 'Répondu';
    c.card.querySelector('[data-r="sn"]').textContent = 'Répondu · ' + (SLOTS[c.q.slot] || ['', c.q.slot])[1];
    c.card.classList.add('done');
    if (!freeze) c.timer = setTimeout(function () { remove(id, 'collapse'); }, HOLD);
    markNewest();
  }

  function markNewest() {
    var open = [];
    Object.keys(cards).forEach(function (k) { if (cards[k].state === 'open') open.push(cards[k]); });
    open.sort(function (a, b) { return +a.wrap.dataset.at - +b.wrap.dataset.at; });
    var newest = open[open.length - 1];
    Object.keys(cards).forEach(function (k) { cards[k].card.classList.toggle('newest', cards[k] === newest); });
  }

  // ---------- état ----------
  var state = { live: [], recording: false, elapsedMs: 0 }, clockAt = 0, freeze = false;

  function render(s) {
    if (!s || typeof s !== 'object') return;
    state = s; clockAt = Date.now();
    var live = Array.isArray(s.live) ? s.live : [];
    var byId = {}; live.forEach(function (q) { byId[q.id] = q; });

    // questions ouvertes visibles : les 3 plus récentes
    var open = live.filter(function (q) { return q.state === 'open'; })
      .sort(function (a, b) { return (a.askedAt || 0) - (b.askedAt || 0); }).slice(-MAX);
    var want = {}; open.forEach(function (q) { want[q.id] = true; });

    // transitions des cartes présentes
    Object.keys(cards).forEach(function (id) {
      var c = cards[id]; if (c.state !== 'open') return;
      var q = byId[id];
      if (q && q.state === 'answered') markAnswered(id, q.answer);
      else if (!q || q.state === 'dismissed' || !want[id]) remove(id, 'fade');
    });
    // nouvelles cartes
    open.forEach(function (q) { if (!cards[q.id]) makeCard(q); });
    markNewest();

    // en-tête
    var rec = !!s.recording;
    head.hidden = !rec;
    var n = live.length;
    cnt.textContent = n + ' question' + (n > 1 ? 's' : '');
    tickClock();
  }
  function tickClock() {
    var ms = (state.elapsedMs || 0) + (state.recording && !freeze ? Math.min(1500, Date.now() - clockAt) : 0);
    var t = fmt(ms);
    if (clk.textContent !== t) clk.textContent = t;
  }
  setInterval(tickClock, 250);

  // ---------- interactions ----------
  stack.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var wrap = b.closest('.slot-wrap'); if (!wrap) return;
    var id = wrap.dataset.id, c = cards[id]; if (!c || c.state !== 'open') return;
    if (b.dataset.act === 'dismiss') { send('dismiss', id); remove(id, 'fade'); }
    else if (b.dataset.act === 'answer') {
      var text = String((c.q.suggestions || [])[+b.dataset.i] || '');
      send('answer', id, text);
      markAnswered(id, text);   // optimiste ; l'état suivant du pont confirme
    }
  });
  // zones cliquables : signale le survol au main (fenêtre transparente traversable sinon)
  function setHover(on) {
    if (on === hoverOn) return; hoverOn = on;
    try { if (bridge && typeof bridge.setHover === 'function') bridge.setHover(on); } catch (e) { /* optionnel */ }
  }
  document.addEventListener('mousemove', function (e) { setHover(!!(e.target.closest && e.target.closest('.card, #head'))); });
  document.addEventListener('mouseleave', function () { setHover(false); });

  // ---------- démarrage ----------
  if (bridge) { bridge.onState(render); return; }

  /* ================= mode démo ================= */
  var qp; try { qp = new URLSearchParams(location.search); } catch (e) { qp = { get: function () { return null; } }; }
  if (qp.get('theme') === 'dark' || qp.get('theme') === 'light') root.setAttribute('data-theme', qp.get('theme'));
  if (qp.get('bg') === 'light' || qp.get('bg') === 'dark') root.setAttribute('data-bg', qp.get('bg'));

  var POOL = [
    { slot: 'cible', question: 'Tes élèves réservent surtout depuis leur téléphone ?', suggestions: ['Oui, mobile d’abord', 'Mobile et ordi'], answer: 'Oui, surtout sur mobile, en sortant du cours.' },
    { slot: 'contraintes', question: 'Un budget d’hébergement à respecter ?', suggestions: ['Gratuit', 'Moins de 10 €/mois'], answer: 'Zéro euro : hébergement gratuit.' },
    { slot: 'role', question: 'La stack est imposée, ou Claude Code peut proposer ?', suggestions: ['Next.js + Supabase', 'Libre, propose'], answer: 'Next.js + Supabase, c’est décidé.' },
    { slot: 'format', question: 'Tu veux d’abord un plan, ou du code tout de suite ?', suggestions: ['Un plan d’abord', 'Le MVP direct'], answer: 'Un plan et l’arborescence d’abord.' },
    { slot: 'criteres', question: 'À quoi verras-tu que c’est réussi ?', suggestions: ['Réserver en < 30 s', 'Zéro double réservation', 'La gérante gère seule'], answer: 'Une élève réserve en moins de 30 secondes.' },
    { slot: 'exemples', question: 'Une appli dont il faut s’inspirer pour le planning ?', suggestions: [], answer: 'Le planning de Momoyoga, en plus simple.' }
  ];
  var t0 = Date.now(), seq = 0, live = [];
  function snapshot() { return { live: live.map(function (q) { return Object.assign({}, q); }), title: 'Appli de réservation — studio de yoga', recording: true, elapsedMs: Date.now() - t0 }; }
  function push() { render(snapshot()); }
  function ask(i, at) {
    var p = POOL[i % POOL.length];
    var q = { id: 'q' + (++seq), slot: p.slot, question: p.question, suggestions: p.suggestions.slice(), state: 'open', askedAt: at || Date.now(), _a: p.answer };
    live.push(q); return q;
  }
  function find(id) { return live.filter(function (q) { return q.id === id; })[0]; }
  demo = {
    answer: function (id, text) { var q = find(id); if (q) { q.state = 'answered'; q.answer = text; } setTimeout(push, 120); },
    dismiss: function (id) { var q = find(id); if (q) q.state = 'dismissed'; setTimeout(push, 60); }
  };

  var scene = qp.get('scene');
  if (scene) {
    freeze = true;
    t0 = Date.now() - 214000;
    var base = Date.now() - 60000;
    var n = scene === 'answered' ? 3 : Math.max(1, Math.min(3, +scene || 1));
    for (var i = 0; i < n; i++) ask(i + 2, base + i * 9000);
    live.unshift({ id: 'q0', slot: 'cible', question: POOL[0].question, suggestions: [], state: 'answered', answer: POOL[0].answer, askedAt: base - 30000 });
    render(snapshot());
    if (scene === 'answered') {
      // la plus ancienne vient d'être répondue à la voix : coche verte figée
      var first = live[1]; first.state = 'answered'; first.answer = first._a;
      setTimeout(function () { render(snapshot()); }, 450);
    }
    return;
  }

  // scénario en boucle : une question toutes les quelques secondes, réponses « à la voix »
  var step = 0;
  push();
  function loop() {
    var open = live.filter(function (q) { return q.state === 'open'; });
    if (step % 3 === 2 && open.length) {          // réponse orale à la plus ancienne
      var q = open[0]; q.state = 'answered'; q.answer = q._a;
    } else if (step % 7 === 6 && open.length > 1) { // l'utilisateur passe à autre chose
      open[open.length - 2].state = 'dismissed';
    } else if (open.length < MAX) {
      ask(step);
    } else {
      open[0].state = 'answered'; open[0].answer = open[0]._a;
    }
    step++;
    push();
    setTimeout(loop, 2600 + Math.random() * 1400);
  }
  setTimeout(loop, 800);
  setInterval(push, 1000);
})();
</script>
